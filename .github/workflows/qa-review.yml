name: QA Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: qa-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA Review
    if: >-
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/qa'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      SKLAB_NO_ANALYTICS: "1"
      NO_COLOR: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve PR context
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_NUMBER="${{ github.event.issue.number }}"
            HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        run: git checkout ${{ steps.context.outputs.head_sha }}

      - name: Shell pre-filter
        id: prefilter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # /qa comment always passes
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "should_continue=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get changed files in PR
          BASE_SHA=$(gh pr view "${{ steps.context.outputs.pr_number }}" --json baseRefOid -q .baseRefOid)
          CHANGED=$(git diff --name-only "$BASE_SHA"..HEAD)

          # Check if ALL changes are trivially non-functional
          ONLY_NONFUNCTIONAL=true
          while IFS= read -r file; do
            case "$file" in
              tests/fixtures/skills/*) ONLY_NONFUNCTIONAL=false; break ;;
              docs/*|*.md|.github/*|.claude/*|CLAUDE.md|LICENSE|.gitignore) ;;
              *) ONLY_NONFUNCTIONAL=false; break ;;
            esac
          done <<< "$CHANGED"

          if [ "$ONLY_NONFUNCTIONAL" = "true" ]; then
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
            echo "Pre-filter: SKIP (docs/CI only)"
          else
            echo "should_continue=true" >> "$GITHUB_OUTPUT"
            echo "Pre-filter: PASS (functional files changed)"
          fi

      - name: Set up Python 3.12
        if: steps.prefilter.outputs.should_continue == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sklab
        if: steps.prefilter.outputs.should_continue == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run QA via Claude
        if: steps.prefilter.outputs.should_continue == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read the file .github/qa/qa-prompt.md for your complete QA instructions.

            Context for this run:
            - PR number: ${{ steps.context.outputs.pr_number }}
            - Head SHA: ${{ steps.context.outputs.head_sha }}
            - Repository: ${{ github.repository }}
            - Trigger: ${{ github.event_name }}

            Follow the instructions in the prompt file exactly.
          claude_args: "--model claude-sonnet-4-20250514 --max-turns 30 --allowedTools Bash,Read,Glob,Grep"
